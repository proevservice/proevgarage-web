name: Sync Facebook content to Version 3 preview
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Update Version 3 preview content
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: facebook-sync
  cancel-in-progress: false
jobs:
  sync-preview:
    if: github.event_name == 'workflow_dispatch' || vars.FACEBOOK_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/website-version3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test preview importer
        run: node --test scripts/facebook-tag.test.mjs scripts/facebook-sync-lifecycle.test.mjs scripts/sync-facebook.test.mjs scripts/facebook-media.test.mjs scripts/facebook-articles.test.mjs scripts/facebook-auth.test.mjs
      - name: Import tagged work and articles
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/sync-facebook.mjs
      - name: Update Version 3 preview only
        if: github.event_name == 'schedule' || inputs.apply == true
        run: |
          git config user.name "PRO EV content sync"
          git config user.email "content-sync@users.noreply.github.com"
          git add content/work content/articles public/images/facebook
          if ! git diff --cached --quiet; then
            git commit -m "Refresh selected Facebook work and articles"
            git push origin HEAD:codex/website-version3
          fi
