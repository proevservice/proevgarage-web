name: Import Facebook repair posts
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Commit imported content (leave off to preview only)
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: facebook-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.FACEBOOK_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Page repair posts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/sync-facebook.mjs
      - name: Save import preview
        uses: actions/upload-artifact@v4
        with:
          name: facebook-work-preview
          path: |
            content/work
            public/images/facebook
          if-no-files-found: warn
      - name: Test sync behavior
        run: node --test scripts/facebook-tag.test.mjs scripts/facebook-sync-lifecycle.test.mjs scripts/sync-facebook.test.mjs scripts/facebook-media.test.mjs
      - name: Commit updated content
        if: github.event_name == 'schedule' || inputs.apply == true
        run: |
          git config user.name "PRO EV content sync"
          git config user.email "content-sync@users.noreply.github.com"
          git add content/work public/images/facebook
          if ! git diff --cached --quiet; then
            git commit -m "Update repair posts from Facebook"
            git push
          fi

