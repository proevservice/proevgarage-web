name: Validate SEO and answer content
on:
  pull_request:
  push:
    branches: [codex/website-version3]
    paths:
      - 'src/**'
      - 'content/**'
      - 'scripts/check-seo.mjs'
      - '.github/workflows/seo-check.yml'
permissions:
  contents: read
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [preview, production]
    env:
      VERCEL_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-seo.mjs
