name: Validate Facebook work sync
on:
  pull_request:
  push:
    branches: [codex/facebook-work-sync-preview]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test scripts/facebook-tag.test.mjs scripts/facebook-sync-lifecycle.test.mjs scripts/sync-facebook.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
