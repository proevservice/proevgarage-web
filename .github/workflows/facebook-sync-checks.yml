name: Validate Facebook work sync
on:
  pull_request:
  push:
    branches: [codex/facebook-work-sync-preview]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test scripts/facebook-tag.test.mjs scripts/facebook-sync-lifecycle.test.mjs scripts/sync-facebook.test.mjs scripts/facebook-media.test.mjs scripts/facebook-articles.test.mjs scripts/facebook-auth.test.mjs scripts/service-work.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  preview-import:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/facebook-work-sync-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import selected posts without publishing
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/sync-facebook.mjs
      - name: Save selected work preview
        uses: actions/upload-artifact@v4
        with:
          name: facebook-work-preview
          path: |
            content/work
            content/articles
            public/images/facebook
          if-no-files-found: warn
      - name: Update preview branch with full galleries
        run: |
          git config user.name "proevservice"
          git config user.email "254152759+proevservice@users.noreply.github.com"
          git add content/work content/articles public/images/facebook
          if ! git diff --cached --quiet; then
            git commit -m "Refresh selected Facebook galleries for preview"
            git push origin HEAD:codex/facebook-work-sync-preview
          fi
